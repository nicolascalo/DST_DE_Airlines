version: "3.3"
services:
  mongodb:
    image : mongo:7.0
    container_name: dst_de_airlines_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airlines
      MONGO_INITDB_ROOT_PASSWORD: airlines
    volumes:
      - ./bdd_afklm_volumes:/data/db
    ports:
      - 27017:27017
      
      
  api:               
    build: .
    container_name: dst_de_airlines_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://airlines:airlines@mongodb:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data
    depends_on:
      - mongodb
