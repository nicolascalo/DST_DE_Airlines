services:

#------------------------------------------------------------------------------------API MACHINE LEARNING--------------------------------------

  afklm_ml_api:
    build:
      context: ./3_ML
      dockerfile: afklm_ml_api_Dockerfile
    container_name: afklm_ml_api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - ./3_ML/outputs:/outputs
      - ./3_ML/config:/config
      - ./3_ML/data:/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      OUTPUT_DIR: "outputs"


  #------------------------------ MONGO DB BDD-------------------------------------------------------------------------------------------
    
  afklm_mongodb:
    image: mongo:7.0
    container_name: afklm_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airlines
      MONGO_INITDB_ROOT_PASSWORD: airlines
    volumes:
      - ./2_bdd/MongoDb/mongodb_volume:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped



  #------------------------------ MONGO DB IMPORT DUMP -------------------
  
  afklm_mongodb_import:
    image: mongo:7.0
    container_name: afklm_mongodb_import
    depends_on:
      afklm_mongodb:
        condition: service_healthy
    environment:
      MONGO_HOST: afklm_mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: airlines
      MONGO_PASSWORD: airlines
      MONGO_DATABASE: airlines
    volumes:
      - ./2_bdd/MongoDb/data_dump:/dumps:ro
    command: 
      - bash
      - -c
      - |
        set -e
        echo "Checking for dump files in /dumps/..."
        if ls /dumps/*.archive.gz 1> /dev/null 2>&1; then
          DUMP_FILE=$$(ls /dumps/*.archive.gz | head -n 1)
          echo "Found dump: $$DUMP_FILE"
          echo "Starting mongorestore..."
          mongorestore \
            --host="$$MONGO_HOST:$$MONGO_PORT" \
            --username="$$MONGO_USERNAME" \
            --password="$$MONGO_PASSWORD" \
            --authenticationDatabase=admin \
            --db="$$MONGO_DATABASE" \
            --archive="$$DUMP_FILE" \
            --gzip \
            --drop
          echo "Import completed successfully!"
        else
          echo "No dump found, skipping import."
        fi
    restart: "no"


#--------------------------------------------------------------------------------------------------MONGO_DB_API--------------------------------------------------------
  afklm_mongodb_api:
    build:
      context: ./2_bdd/MongoDb/dst_de_airlines_api/
      dockerfile: Dockerfile
    container_name: afklm_mongodb_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://airlines:airlines@afklm_mongodb:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      afklm_mongodb:
        condition: service_healthy
      afklm_mongodb_import:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s



  #------------------------------------------GET OPERATIONAL FLIGHTS FROM DATA FOLDER--------------------------------------
  afklm_mongodb_init:
    build:
      context: ./2_bdd/MongoDb/dst_de_airlines_api/
      dockerfile: Insert_by_op_flights_Dockerfile
    container_name: afklm_mongodb_init

    environment:
      - MONGODB_URI=mongodb://airlines:airlines@afklm_mongodb:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data/
    volumes:
    - ./1_data_collection/afklm_api_collection/data:/app/data
    depends_on:
      afklm_mongodb_api:
        condition: service_healthy
    restart: "no"
    networks:
      - default


#----------------------------------------------------AFKLM API---------------------
    
  afklm_api:
      build:
        context: ./2_bdd/Postgre/afklm_api/
        dockerfile: Dockerfile
      container_name: afklm_api
      ports:
        - "8004:8004"
      environment:
        - API_DST_AIRLINES_URL=http://afklm_mongodb_api:8000/
        - DATA_INPUT=/app/data_input/
      extra_hosts:
        - "host.docker.internal:host-gateway"
      depends_on:
        afklm_mongodb_api:
          condition: service_healthy
        afklm_mongodb_init:
          condition: service_completed_successfully
      restart: unless-stopped
      volumes:
        - ./2_bdd/Postgre/data_input:/app/data_input
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8004"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 15s



#---------------------------------------------------------DOWNLOAD DATA TO INPUT IT IN INPUT DATA FOLDER-----------------


  afklm_download_data:
    build:
      context: ./2_bdd/Postgre/
      dockerfile: download_collection_to_input_data_Dokerfile
    container_name: afklm_download_data
    environment:
      - AFKLM_API_URL=http://afklm_api:8004/
    depends_on:
      afklm_api:
        condition: service_healthy
    restart: "no"
    networks:
      - default



#-------------------------------------------------------------BDD POSTGRES--------------------------------------------------------------

  afklm_postgres:
    container_name: afklm_postgres
    build:
      context: ./2_bdd/Postgre/
      dockerfile: postgres_Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
    ports:
      - "5432:5432"
    depends_on:
        afklm_api:
          condition: service_healthy
#        afklm_download_data:
#          condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s      
    volumes:
      - ./2_bdd/Postgre/postgres_volume:/var/lib/postgresql/data
      - ./2_bdd/Postgre/data_input:/data_input
      - ./2_bdd/Postgre/tmp:/tmp


#-------------------------------------------------------------------------POSTGRES API--------------------------------------------------------------------------------

  afklm_postgre_api:
    build: 
      context: ./2_bdd/Postgre/
      dockerfile: afklm_postgre_api_Dockerfile
    container_name: afklm_postgre_api
    hostname: afklm_postgre_api
    restart: always
    ports:
      - 8002:8002
    depends_on:
      afklm_postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      SQL_FILE_FOLDER: /postgres_data_import_scripts
      DATA_FILE_FOLDER: /data_input
    volumes:
      - ./2_bdd/Postgre/data_input:/data_input
      - ./2_bdd/Postgre/tmp:/tmp

#------------------------------------------------------------------------------PG PGADMIN-------------------------------------------------------------------

  afklm_postgres_pgadmin:
    container_name: afklm_pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@datascientest.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3

#-------------------------------------------------------------------------DASH--------------------------------------------------------------------------------

  afklm_dashboard_api:
    build: 
      context: ./4_dashboard/
      dockerfile: Dockerfile
    container_name: afklm_dashboard_api
    hostname: afklm_dashboard_api
    restart: always
    ports:
      - 8050:8050
    volumes:
      - ./4_dashboard/assets:/app/assets
    depends_on:
      afklm_ml_api:
        condition: service_healthy
      afklm_postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      ML_API_PORT: 8001
      ML_API_HOST: afklm_ml_api
