services:

#------------------------------------------------------------------------------------API MACHINE LEARNING--------------------------------------

  dst_de_airlines_ml_api:
    build:
      context: ./3_ML
      dockerfile: afklm_ml_api_Dockerfile
    container_name: dst_de_airlines_ml_api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - ./3_ML/outputs:/outputs
      - ./3_ML/config:/config
      - ./3_ML/data:/data

  #------------------------------ MONGO DB BDD-------------------------------------------------------------------------------------------
    
  mongodb:
    image: mongo:7.0
    container_name: dst_de_airlines_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airlines
      MONGO_INITDB_ROOT_PASSWORD: airlines
    volumes:
      - ./2_bdd/MongoDb/mongodb_volume:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

#--------------------------------------------------------------------------------------------------MONGO_DB_API--------------------------------------------------------
  mongodb_api:
    build:
      context: ./2_bdd/MongoDb/dst_de_airlines_api/
      dockerfile: Dockerfile
    container_name: dst_de_airlines_mongodb_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://airlines:airlines@host.docker.internal:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
#-------------------------------------------------------------BDD POSTGRES--------------------------------------------------------------

  dst_de_airlines_postgres:
    container_name: dst_de_airlines_postgres
    build:
      context: ./2_bdd/Postgre/
      dockerfile: postgres_Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s      
    volumes:
      - ./2_bdd/Postgre/postgres_volume:/var/lib/postgresql/data
      

#------------------------------------------------------------------------------PG ADMIN-------------------------------------------------------------------

  dst_de_airlines_postgres_pgadmin:
    container_name: dst_de_airlines_pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@datascientest.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3

#-------------------------------------------------------------------------DASH--------------------------------------------------------------------------------

  dst_de_airlines_dashboard_api:
    build: 
      context: ./4_dashboard/
      dockerfile: Dockerfile
    container_name: afklm_dashboard_api
    hostname: afklm_dashboard_api
    restart: always
    ports:
      - 8050:8050
    depends_on:
      dst_de_airlines_ml_api:
        condition: service_healthy
      dst_de_airlines_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8050"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
