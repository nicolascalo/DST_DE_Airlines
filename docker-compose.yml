services:

#------------------------------------------------------------------------------------API MACHINE LEARNING--------------------------------------

  afklm_ml_api:
    build:
      context: ./3_ML
      dockerfile: afklm_ml_api_Dockerfile
    container_name: afklm_ml_api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - ./3_ML/outputs:/outputs
      - ./3_ML/config:/config
      - ./3_ML/data:/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      OUTPUT_DIR: "outputs"


  #------------------------------ MONGO DB BDD-------------------------------------------------------------------------------------------
    
  afklm_mongodb:
    image: mongo:7.0
    container_name: afklm_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airlines
      MONGO_INITDB_ROOT_PASSWORD: airlines
    volumes:
      - ./2_bdd/MongoDb/mongodb_volume:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped


#------------------------------------------DATA INSERTION FROM DATA FILE--------------------------------------
  afklm_mongodb_init:
    build:
      context: ./2_bdd/MongoDb/dst_de_airlines_api/
      dockerfile: Insert_by_op_flights_Dockerfile
    container_name: afklm_mongodb_init
    environment:
      - MONGODB_URI=mongodb://airlines:airlines@afklm_mongodb:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data/
    volumes:
    - ./1_data_collection/afklm_api_collection/data:/app/data
    depends_on:
      afklm_mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - default


      

#--------------------------------------------------------------------------------------------------MONGO_DB_API--------------------------------------------------------
  afklm_mongodb_api:
    build:
      context: ./2_bdd/MongoDb/dst_de_airlines_api/
      dockerfile: Dockerfile
    container_name: afklm_mongodb_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://airlines:airlines@host.docker.internal:27017/airlines?authSource=admin
      - DATABASE_NAME=airlines
      - FOLDER_PATH=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      afklm_mongodb:
        condition: service_healthy
      afklm_mongodb_init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
#-------------------------------------------------------------BDD POSTGRES--------------------------------------------------------------

  afklm_postgres:
    container_name: afklm_postgres
    build:
      context: ./2_bdd/Postgre/
      dockerfile: postgres_Dockerfile
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s      
    volumes:
      - ./2_bdd/Postgre/postgres_volume:/var/lib/postgresql/data



#-------------------------------------------------------------------------POSTGRES API--------------------------------------------------------------------------------

  afklm_postgre_api:
    build: 
      context: ./2_bdd/Postgre/
      dockerfile: afklm_postgre_api_Dockerfile
    container_name: afklm_postgre_api
    hostname: afklm_postgre_api
    restart: always
    ports:
      - 8002:8002
    depends_on:
      afklm_postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      SQL_FILE_FOLDER: /app/docker-entrypoint-initdb.d
      DATA_FILE_FOLDER: /app/data_input
    volumes:
      - ./2_bdd/Postgre/data_input:/app/data_input


#------------------------------------------------------------------------------PG PGADMIN-------------------------------------------------------------------

  afklm_postgres_pgadmin:
    container_name: afklm_pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@datascientest.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3

#-------------------------------------------------------------------------DASH--------------------------------------------------------------------------------

  afklm_dashboard_api:
    build: 
      context: ./4_dashboard/
      dockerfile: Dockerfile
    container_name: afklm_dashboard_api
    hostname: afklm_dashboard_api
    restart: always
    ports:
      - 8050:8050
    depends_on:
      afklm_ml_api:
        condition: service_healthy
      afklm_postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afklm
      POSTGRES_URI: afklm_postgres
      POSTGRES_PORT: 5432
      ML_API_PORT: 8001
      ML_API_HOST: afklm_ml_api



